<style>
  :root {
    --ground: #ffffff;
    --ink: #15171c;
    --muted: #646a75;
    --hair: #e3e6eb;
    --accent: #1a56ff;
    --accent-soft: #e8eeff;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  .brand {
    position: fixed; top: 20px; left: 24px; z-index: 3;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    pointer-events: none;
  }
  .brand b { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; }
  .brand span { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .hint {
    position: fixed; top: 22px; right: 24px; z-index: 3;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none;
  }

  /* Spec sheet */
  #panel {
    position: fixed; z-index: 2;
    top: 50%; right: clamp(16px, 5vw, 72px);
    transform: translateY(-54%);
    width: min(420px, 38vw);
    max-height: calc(100vh - 190px);
    overflow-y: auto;
    padding-block: 8px;
  }
  #panel .inner {
    transition: opacity .35s ease, transform .35s ease;
    background: rgba(255,255,255,.88); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 22px 24px; border-radius: 6px;
  }
  #panel.swap .inner { opacity: 0; transform: translateX(14px); }
  .eyebrow {
    display: flex; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .eyebrow .slot { color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 3px; }
  .ptype {
    margin-top: 18px;
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);

  h1 {
    margin: 6px 0 0;
    font-family: var(--display); font-weight: 700; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.08;
    text-wrap: balance; letter-spacing: -0.005em;

  .price {
    margin-top: 14px; display: flex; align-items: baseline; gap: 10px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .price strong { font-size: 22px; font-weight: 500; color: var(--accent); }
  .price small { font-size: 12px; color: var(--muted); }
  .rule { height: 1px; background: var(--hair); margin: 20px 0 18px; }
  ul.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  ul.points li {
    position: relative; padding-left: 22px;
    font-size: 15px; line-height: 1.55; max-width: 62ch;
  }
  ul.points li::before {
    content: ""; position: absolute; left: 2px; top: 0.62em;
    width: 8px; height: 8px; border: 1.5px solid var(--accent); transform: rotate(45deg);
  }

  /* Overview list */
  .lead { margin: 12px 0 0; font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 46ch; }
  .parts { list-style: none; margin: 0; padding: 0; }
  .parts button {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline;
    padding: 7px 4px; border: 0; border-bottom: 1px solid var(--hair); background: none; cursor: pointer;
    font: inherit; color: var(--ink); text-align: left;

  .parts button:hover { background: var(--accent-soft); }
  .parts .n { font-size: 14px; }
  .parts .n em { font-style: normal; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; }
  .parts .p { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .total {

  .total strong { font-family: var(--mono); font-weight: 500; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .total small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

  .prose h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .keyparts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

  .keyparts em { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

  /* Bottom navigation */
  nav.deck {
    position: fixed; z-index: 3; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    padding: 8px; background: rgba(255,255,255,.92); border: 1px solid var(--hair); border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  nav.deck .arrow {
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ink); color: #fff;
    display: grid; place-items: center; cursor: pointer; transition: transform .15s ease, background .15s ease;
  }
  nav.deck .arrow:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  nav.deck .arrow:active:not(:disabled) { transform: scale(.94); }
  nav.deck .arrow:disabled { background: #fff; color: #b9bec7; border-color: var(--hair); cursor: default; }
  nav.deck .arrow svg { width: 20px; height: 20px; }
  .mid { display: grid; justify-items: center; gap: 6px; min-width: 190px; }
  .mid .label { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dots { display: flex; gap: 6px; }
  .dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: #cfd3da; cursor: pointer; transition: width .25s ease, background .25s ease; }
  .dots button.on { width: 20px; border-radius: 4px; background: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  #tip {
    position: fixed; z-index: 4; pointer-events: none; padding: 5px 9px; border-radius: 4px;
    background: var(--ink); color: #fff; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; white-space: nowrap;
    transform: translate(14px, 14px);
  }

  #fallback { position: fixed; left: 24px; top: 70px; max-width: 36ch; font-size: 14px; color: var(--muted); }

  @media (max-width: 760px) {
    .hint { display: none; }
    #panel {
      top: auto; right: 0; left: 0; bottom: 96px; transform: none;
      width: auto; max-height: 44vh; padding-inline: 20px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 28px);
      padding-top: 30px;
    }
    #panel .inner { padding: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    h1 { font-size: 23px; }
    ul.points { gap: 10px; }
    ul.points li { font-size: 14px; }
    .mid { min-width: 120px; }
    .dots { display: none; }
    nav.deck { bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #panel .inner, .dots button, nav.deck .arrow { transition: none; }
  }
</style>

/* ---------- Scene ---------- */
const stage = document.getElementById("stage");
const panelInner = document.getElementById("panelInner");
let renderer;
try {
  if (!window.THREE) throw new Error("three.js did not load");
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  panelInner.innerHTML = '<p class="lead">The 3D viewer could not start. Reload the page, or open it in a browser with WebGL turned on.</p>';
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 4000);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd6dce5, 0.8));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
keyLight.position.set(90, 190, 140);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -140, right: 140, top: 120, bottom: -120, near: 10, far: 700 });
keyLight.shadow.camera.updateProjectionMatrix();
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xe3eaff, 0.35); fillLight.position.set(-160, 80, 60); scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3); rimLight.position.set(40, 60, -180); scene.add(rimLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.ShadowMaterial({ opacity: 0.09 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

/* ---------- Builders ---------- */
const groups = {}, spinners = [], rgbTextures = [], rgbTexturesX = [];
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// Rounded, bevelled slab: footprint w×d, height h, bottom at y = 0
function slabGeo(w, d, h, r, bevel = 0.2) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w - 2 * bevel, d - 2 * bevel, Math.max(r - bevel, 0.01)), {
    depth: Math.max(h - 2 * bevel, 0.001), bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 6
  });
  g.rotateX(-Math.PI / 2); g.translate(0, bevel, 0);
  return g;
}
function part(id, parent = scene) { const g = new THREE.Group(); groups[id] = g; parent.add(g); return g; }
const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0.05 }, o));
const basic = (color) => new THREE.MeshBasicMaterial({ color });
function box(parent, w, h, d, m, x = 0, y = 0, z = 0) {
  const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; parent.add(me); return me;
}
function cyl(parent, rt, rb, h, m, x = 0, y = 0, z = 0, seg = 28) {
  const me = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; parent.add(me); return me;
}
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
function textTex(lines, { w = 512, h = 128, bg = null, fg = "#fff" } = {}) {
  return canvasTex(w, h, (c) => {
    if (bg) { c.fillStyle = bg; c.fillRect(0, 0, w, h); }
    c.fillStyle = fg; c.textAlign = "center"; c.textBaseline = "middle";
    const step = h / (lines.length + 1);
    lines.forEach(([txt, size, weight = 700], i) => {
      c.font = `${weight} ${size}px "Helvetica Neue", Arial, sans-serif`;
      c.fillText(txt, w / 2, step * (i + 1));
    });
  });
}
function label(parent, w, h, tex, x, y, z) {
  const me = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.7 }));
  me.position.set(x, y, z); parent.add(me); return me;
}
// Shared textures for fans
const caseGlow = canvasTex(256, 8, (c, w, h) => { for (let x = 0; x < w; x++) { c.fillStyle = `hsl(${(x / w) * 360},85%,60%)`; c.fillRect(x, 0, 1, h); } });
caseGlow.wrapS = THREE.RepeatWrapping; rgbTexturesX.push(caseGlow);
const hubTex = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = "#2a2d33"; c.fillRect(0, 0, w, h);
  c.strokeStyle = "#6b717b"; c.lineWidth = 5; c.beginPath(); c.arc(w / 2, h / 2, 44, 0, Math.PI * 2); c.stroke();
  c.fillStyle = "#8a909a"; c.beginPath(); c.arc(w / 2, h / 2, 10, 0, Math.PI * 2); c.fill();
});

// A fan built in the XY plane, spinning about Z; its intake side faces +Z
const fanGeoCache = {};
function fanGeos(size, thick) {
  const key = size + "|" + thick;
  if (fanGeoCache[key]) return fanGeoCache[key];
  const frame = roundedRect(size, size, size * 0.06);
  const hole = new THREE.Path(); hole.absarc(0, 0, size * 0.465, 0, Math.PI * 2, true); frame.holes.push(hole);
  const frameG = new THREE.ExtrudeGeometry(frame, { depth: thick, bevelEnabled: false, curveSegments: 32 });
  frameG.translate(0, 0, -thick / 2);
  const r0 = size * 0.15, span = size * 0.3, cw = size * 0.2;
  const bs = new THREE.Shape();
  bs.moveTo(0, -cw * 0.25);
  bs.quadraticCurveTo(span * 0.55, -cw * 0.6, span, -cw * 0.05);
  bs.quadraticCurveTo(span * 0.9, cw * 0.55, span * 0.35, cw * 0.5);
  bs.quadraticCurveTo(0, cw * 0.35, 0, -cw * 0.25);
  const bladeG = new THREE.ExtrudeGeometry(bs, { depth: Math.min(0.12, thick * 0.2), bevelEnabled: false, curveSegments: 8 });
  bladeG.translate(r0 * 0.85, 0, 0);
  return (fanGeoCache[key] = { frameG, bladeG, r0 });
}
function fan(parent, size, thick, frameM, bladeM, speed = 5, { blades = 9, glow = false, frame = true } = {}) {
  const g = new THREE.Group(); parent.add(g);
  const G = fanGeos(size, thick);
  if (frame) {
    const fr = new THREE.Mesh(G.frameG, frameM); fr.castShadow = fr.receiveShadow = true; g.add(fr);
    const holeM = mat(0x0b0c0e);

  return `<div class="eyebrow"><span class="slot">${esc(p.slot)}</span><span>Part ${i} of ${PARTS.length}</span></div>
    <div class="ptype">${p.type}</div>
    <h1>${esc(p.name)}</h1>
    <div class="price">${p.price == null ? "<small>Price not listed</small>" : `<strong>${money(p.price)}</strong>`}</div>
    <div class="rule"></div>
    <ul class="points">${p.points.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
}
function howHTML() {
  const key = ["cpu", "gpu", "ram"].map((id) => `<button type="button" data-go="${ORDER.indexOf(id)}"><em>${byId[id].type}</em><span>${esc(SHORT[id])}</span></button>`).join("");
  return `<div class="eyebrow"><span class="slot">The tower</span><span>Summary</span></div>
    <h1>How it works</h1>
    <div class="prose">${HOW_TEXT.how.map((t) => `<p>${esc(t)}</p>`).join("")}</div>
    <div class="keyparts">${key}</div>
    <div class="rule"></div>
    <div class="prose"><h2>Reflection</h2><p>${esc(HOW_TEXT.reflection)}</p></div>`;
}
function renderPanel(animate) {
  const html = index === 0 ? overviewHTML() : index === HOW ? howHTML() : partHTML(index);
  const commit = () => {
    panelInner.innerHTML = html; panel.scrollTop = 0;
    panelInner.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => goTo(+b.dataset.go)));
    panel.classList.remove("swap");
  };
  clearTimeout(swapTimer);
  if (!animate || reduced) return commit();
  panel.classList.add("swap");
  swapTimer = setTimeout(commit, 220);
}
ORDER.forEach((id, i) => {
  const d = document.createElement("button");
  d.type = "button"; d.setAttribute("aria-label", i === 0 ? "Overview" : i === HOW ? "How it works" : PARTS[i - 1].type);
  d.addEventListener("click", () => goTo(i));
  dotsEl.appendChild(d);
});
function updateNav() {
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === ORDER.length - 1;
  slideLabel.textContent = index === 0 ? "Overview" : index === HOW ? "How it works" : `${String(index).padStart(2, "0")} / ${PARTS.length} · ${PARTS[index - 1].type}`;
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === index));
}
function goTo(i, animate = true) {
  i = Math.max(0, Math.min(ORDER.length - 1, i));
  if (i === index && animate) return;
  setSlide(i); renderPanel(animate); updateNav();
  try { history.replaceState(null, "", "#" + ORDER[i]); } catch (e) {}
}
prevBtn.addEventListener("click", () => goTo(index - 1));
nextBtn.addEventListener("click", () => goTo(index + 1));
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goTo(index + 1);
  else if (e.key === "ArrowLeft") goTo(index - 1);
  else if (e.key === "Escape") goTo(0);
});

/* ---------- Pointer ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = renderer.domElement;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  if (!hits.length) return null;
  return (hits.find((h) => vis[h.object.userData.part] > 0.5) || hits[0]).object.userData.part;
}
let down = null;
canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, drag: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (down) {
    if (!down.drag && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down.drag = true; tip.hidden = true; }
    if (down.drag) {
      const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
      goal.az -= dx * 0.006; cam.az -= dx * 0.006;
      goal.el = Math.max(-0.05, Math.min(1.3, goal.el + dy * 0.004));
      lastInteract = elapsed;
    }
    down.lx = e.clientX; down.ly = e.clientY;
    return;
  }
  if (e.pointerType !== "mouse") return;
  const id = pick(e);
  canvas.style.cursor = id ? "pointer" : "grab";
  if (id) {
    tip.textContent = `${byId[id].type} · ${SHORT[id]}`;
    tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false;
  } else tip.hidden = true;
});
canvas.addEventListener("pointerup", (e) => {
  if (down && !down.drag) {
    const id = pick(e);
    if (id) goTo(ORDER.indexOf(id));
  }
  down = null;
});
canvas.addEventListener("pointerleave", () => { tip.hidden = true; });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom = Math.max(0.45, Math.min(2.2, zoom * (1 + e.deltaY * 0.001)));
  lastInteract = elapsed;
}, { passive: false });

/* ---------- Boot + loop ---------- */
addEventListener("resize", resize);
resize();
const startId = decodeURIComponent(location.hash.slice(1));
const startIndex = Math.max(0, ORDER.indexOf(startId));
goTo(startIndex, false);
cam.target.copy(goal.target); cam.el = goal.el + 0.12; cam.az = goal.az - 0.6; cam.dist = goalDistance() * 1.5;

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const idle = !down && elapsed - lastInteract > 2.5;
  const overview = index === 0;
  if (idle && !reduced) {
    if (overview) goal.az += (0.18 + 0.32 * Math.sin(elapsed * 0.1) - goal.az) * (1 - Math.exp(-dt * 0.4));
    else goal.az += dt * 0.17;
  }
  const k = 1 - Math.exp(-dt * 1.8);
  cam.target.lerp(goal.target, k);
  cam.dist += (goalDistance() * zoom - cam.dist) * k;
  cam.el += (goal.el - cam.el) * k;
  cam.az += (goal.az - cam.az) * Math.min(1, k * 1.5);

  const c = Math.cos(cam.el);
  camera.position.set(
    cam.target.x + cam.dist * c * Math.sin(cam.az),
    Math.max(1.5, cam.target.y + cam.dist * Math.sin(cam.el)),
    cam.target.z + cam.dist * c * Math.cos(cam.az)
  );
  camera.lookAt(cam.target);

  const kv = 1 - Math.exp(-dt * 4);
  for (const id in groups) {
    const before = vis[id];
    vis[id] += (visGoal[id] - vis[id]) * kv;
    if (Math.abs(visGoal[id] - vis[id]) < 0.002) vis[id] = visGoal[id];
    if (vis[id] !== before) applyVis(id, vis[id]);
  }
  if (!reduced) {
    for (const s of spinners) s.rotor.rotation.z += dt * s.speed;
    for (const t of rgbTextures) t.offset.y = (elapsed * 0.12) % 1;
    for (const t of rgbTexturesX) t.offset.x = (elapsed * 0.08) % 1;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
